spring.application.name=backend

# Carga backend/.env como fichero de propiedades (opcional: si no existe, se usan las variables de entorno del sistema)
spring.config.import=optional:file:.env[.properties]

# Datasource (Supabase / PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT (firma HMAC-SHA256 con el secreto del .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=7d
app.jwt.issuer=pet-manager

# URL del frontend (redirecciones del login con Google y enlaces del correo)
app.frontend-url=http://localhost:5173

# Login con Google (OAuth2 / OpenID Connect)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Correo (Gmail SMTP con contraseña de aplicación)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Supabase Storage (fotos de mascotas). La clave service_role solo vive en el backend
app.supabase.url=${SUPABASE_URL}
app.supabase.service-key=${SUPABASE_SERVICE_KEY}
app.supabase.photos-bucket=pet-photos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
